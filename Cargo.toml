[package]
name = "evo"
version = "0.1.0"
edition = "2021"
description = "A beautiful and performant evolution simulation with GPU-accelerated graphics"
license = "MIT"
repository = "https://github.com/tre-systems/evo"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-O3']

[lib]
crate-type = ["cdylib"]

[dependencies]
# Core simulation
hecs = "0.11"
rayon = "1.8"
rand = "0.9"
getrandom = { version = "0.3", features = ["wasm_js"] }

# Graphics — WebGPU only (renderer targets BROWSER_WEBGPU; no WebGL fallback)
wgpu = "29.0"
bytemuck = { version = "1.14", features = ["derive"] }

# Utilities
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# WebAssembly support
wasm-bindgen = "0.2.122"
wasm-bindgen-rayon = "1.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "HtmlCanvasElement",
    "Window",
    "Document",
    "Element",
    "console",
] }
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
raw-window-handle = { version = "0.6", features = ["wasm-bindgen-0-2"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
parking_lot = { version = "0.12", features = ["nightly"] }
instant = { version = "0.1", features = ["wasm-bindgen"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
