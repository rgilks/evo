[target.wasm32-unknown-unknown]
# wasm threads (rayon + SharedArrayBuffer) need an imported *shared* memory and the
# TLS-init symbols exported so wasm-bindgen's threading transform can find them.
# On current nightlies lld no longer auto-exports these, so request them explicitly.
# This flag set mirrors wasm-bindgen's own threading reference build. `-Z build-std`
# (atomics-enabled std) is supplied via CARGO_UNSTABLE_BUILD_STD in the build script/CI.
rustflags = [
    # getrandom 0.3 needs an explicit backend selected for wasm32-unknown-unknown
    # (rand 0.9 pulls it in); `wasm_js` routes entropy through the JS crypto API.
    "--cfg", "getrandom_backend=\"wasm_js\"",
    "-C", "target-feature=+atomics,+bulk-memory",
    "-C", "link-arg=--shared-memory",
    "-C", "link-arg=--max-memory=1073741824",
    "-C", "link-arg=--import-memory",
    "-C", "link-arg=--export=__heap_base",
    "-C", "link-arg=--export=__wasm_init_tls",
    "-C", "link-arg=--export=__tls_size",
    "-C", "link-arg=--export=__tls_align",
    "-C", "link-arg=--export=__tls_base",
]
