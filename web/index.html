<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Evo — Artificial Life Simulation</title>
    <meta
      name="description"
      content="A browser artificial-life world: thousands of gene-carrying creatures evolve by natural selection — speciating into distinct colours and body plans, hunting, and surging through boom/bust cycles. Rust + WebGPU."
    />
    <meta name="theme-color" content="#05060d" />
    <link rel="canonical" href="https://evo.tre.systems/" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />

    <!-- Social cards (image links to the repo screenshot, which auto-refreshes) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Evo — Artificial Life Simulation" />
    <meta
      property="og:description"
      content="Thousands of gene-carrying creatures evolve by natural selection — speciating into colours and body plans, hunting, and riding boom/bust cycles. Rust + WebGPU, in the browser."
    />
    <meta property="og:url" content="https://evo.tre.systems/" />
    <meta
      property="og:image"
      content="https://raw.githubusercontent.com/tre-systems/evo/main/screenshot.png"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Evo — Artificial Life Simulation" />
    <meta
      name="twitter:description"
      content="An evolving, speciating swarm of gene-carrying creatures, rendered with WebGPU. Watch natural selection, predation, and boom/bust unfold."
    />
    <meta
      name="twitter:image"
      content="https://raw.githubusercontent.com/tre-systems/evo/main/screenshot.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css?v=dev" />
  </head>
  <body>
    <div class="container">
      <main>
        <canvas
          id="simulation-canvas"
          title="Click to drop food · drag to pan · scroll to zoom · F frame · M sound · ↑/↓ volume"
        ></canvas>

        <!-- Glass control panel: a ⚙ handle toggles it (tap) and drags it
             (press + move). Starts collapsed to a discreet cog over the art. -->
        <div id="controls" class="collapsed">
          <button
            id="controls-toggle"
            type="button"
            aria-expanded="false"
            aria-controls="controls-body"
            aria-label="Toggle controls"
            title="Show controls (drag to move)"
          >
            <span id="controls-icon" aria-hidden="true">⚙</span>
            <span id="controls-label">Evo</span>
          </button>

          <div id="controls-body">
            <!-- Instant actions -->
            <div class="actions">
              <button id="reset" class="btn act" type="button">Reset</button>
              <button id="cull" class="btn act" type="button" title="Remove half the population">Cull</button>
              <button id="bloom" class="btn act" type="button" title="Spawn a burst of new life">Bloom</button>
              <button id="sound" class="btn sound-btn active" type="button" title="Sound on/off (M) · volume ↑/↓">♪</button>
            </div>

            <!-- Ecosystem controls -->
            <div class="group">
              <div class="group-title">Ecosystem</div>
              <div class="ctrl">
                <div class="row"><label for="ambient-energy">Food</label><span class="val" id="food-value">0.35</span></div>
                <input type="range" id="ambient-energy" min="0" max="0.7" step="0.05" value="0.35" />
              </div>
              <div class="ctrl">
                <div class="row"><label for="repro-threshold">Breeding</label><span class="val" id="repro-value">0.45</span></div>
                <input type="range" id="repro-threshold" min="0.1" max="0.8" step="0.05" value="0.45" />
              </div>
              <div class="ctrl">
                <div class="row"><label for="death-chance">Mortality</label><span class="val" id="death-value">0.11</span></div>
                <input type="range" id="death-chance" min="0.02" max="0.2" step="0.01" value="0.11" />
              </div>
              <div class="ctrl">
                <div class="row"><label for="predation-reach">Predators</label><span class="val" id="predation-value">8</span></div>
                <input type="range" id="predation-reach" min="0" max="16" step="1" value="8" />
              </div>
              <div class="ctrl">
                <div class="row"><label for="energy-cost">Metabolism</label><span class="val" id="energy-value">0.36</span></div>
                <input type="range" id="energy-cost" min="0.02" max="0.7" step="0.01" value="0.36" />
              </div>
            </div>

            <!-- Motion & physics controls (collapsible) -->
            <details class="group">
              <summary>Motion &amp; Physics</summary>
              <div class="ctrl">
                <div class="row"><label for="sim-speed">Tempo</label><span class="val" id="sim-speed-value">30</span></div>
                <input type="range" id="sim-speed" min="4" max="180" step="1" value="30" />
              </div>
              <div class="ctrl">
                <div class="row"><label for="particle-force">Clustering</label><span class="val" id="pforce-value">0.15</span></div>
                <input type="range" id="particle-force" min="0" max="2.0" step="0.1" value="0.15" />
              </div>
              <div class="ctrl">
                <div class="row"><label for="particle-friction">Drag</label><span class="val" id="pfriction-value">0.95</span></div>
                <input type="range" id="particle-friction" min="0.8" max="0.99" step="0.01" value="0.95" />
              </div>
              <div class="ctrl">
                <div class="row"><label for="edge-repulsion">Edge push</label><span class="val" id="pressure-value">0.30</span></div>
                <input type="range" id="edge-repulsion" min="0" max="2" step="0.05" value="0.3" />
              </div>
            </details>

            <!-- Visuals: instant, purely-cosmetic eye-candy controls -->
            <details class="group">
              <summary>Visuals</summary>
              <!-- Trait lens: cycle what creature colour represents. -->
              <div class="actions">
                <button id="color-mode" class="btn act" type="button" title="Cycle what creature colour shows: lineage, speed, health, behaviour">Colour: Lineage</button>
              </div>
              <div class="ctrl">
                <div class="row"><label for="glow">Glow</label><span class="val" id="glow-value">0.36</span></div>
                <input type="range" id="glow" min="0" max="0.72" step="0.02" value="0.36" />
              </div>
              <div class="ctrl">
                <div class="row"><label for="trails">Trails</label><span class="val" id="trails-value">0.875</span></div>
                <input type="range" id="trails" min="0.79" max="0.96" step="0.005" value="0.875" />
              </div>
              <div class="ctrl">
                <div class="row"><label for="creature-size">Size</label><span class="val" id="size-value">0.20</span></div>
                <input type="range" id="creature-size" min="0.05" max="0.35" step="0.025" value="0.2" />
              </div>
              <div class="ctrl">
                <div class="row"><label for="brightness">Brightness</label><span class="val" id="brightness-value">0.80</span></div>
                <input type="range" id="brightness" min="0.4" max="1.2" step="0.05" value="0.8" />
              </div>
            </details>

            <!-- Footer: support + credit -->
            <div class="panel-footer">
              <a class="coffee" id="bmc-link" href="https://ko-fi.com/N4N31DPNUS" target="_blank" rel="noopener noreferrer">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 3H4v10a5 5 0 0 0 5 5h6a5 5 0 0 0 5-5v-2h1a3 3 0 0 0 0-6h-1V3zm0 4h1a1 1 0 0 1 0 2h-1V7zM2 21h18v2H2z" /></svg>
                Buy me a coffee
              </a>
              <a class="credit" href="https://tre.systems" target="_blank" rel="noopener noreferrer">
                <svg viewBox="0 0 512 512" aria-hidden="true"><rect x="214" y="288" width="80" height="206" fill="#888" transform="rotate(22,262,295)" /><path d="M256 36 L72 476 L440 476 Z" fill="none" stroke="#888" stroke-width="34" stroke-linejoin="round" /><circle cx="256" cy="288" r="40" fill="#888" /></svg>
                Total Reality Engineering
              </a>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script type="module" src="js/app.js?v=9b218cf"></script>
  </body>
</html>
